---
name: 'AWS Credentials'
description: 'Sign in to AWS by GitHub OIDC and write the named profile Terraform uses'
inputs:
  role-to-assume:
    description: 'AWS role to assume; its trust must admit this repository''s GitHub OIDC tokens'
    required: true
  aws-region:
    description: 'AWS region'
    required: true
  role-duration-seconds:
    description: 'AWS role duration in seconds'
    required: true
    default: 1200
  aws-profile:
    description: 'AWS profile the credentials are written to; the Terraform backend and provider name it'
    required: true
    default: 'default'

runs:
  using: 'composite'
  steps:
    # The calling job needs `permissions: id-token: write`.
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.aws-region }}
        role-duration-seconds: ${{ inputs.role-duration-seconds }}
        aws-profile: ${{ inputs.aws-profile }}
        mask-aws-account-id: true

    - name: Show assumed role
      shell: bash
      env:
        AWS_PROFILE: ${{ inputs.aws-profile }}
      run: aws sts get-caller-identity --query Arn --output text
